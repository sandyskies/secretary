# CI Workflow for Secretary
# Provides automated checks for TypeScript, ESLint, and Go (when applicable)
name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  nodejs:
    name: Node.js Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Secretary/package-lock.json

      - name: Install dependencies
        working-directory: Secretary
        run: npm ci

      - name: Run TypeScript check
        working-directory: Secretary
        run: npm run type-check

      - name: Run ESLint
        working-directory: Secretary
        run: npm run lint

  golang:
    name: Go Checks
    runs-on: ubuntu-latest
    # Skip if Go source files don't exist
    if: hashFiles('**/*.go') != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Download Go dependencies
        run: go mod download || echo "No go.mod found, skipping"

      - name: Run gofmt
        run: |
          fmt_output=$(gofmt -l .)
          if [ -n "$fmt_output" ]; then
            echo "Files not formatted properly:"
            echo "$fmt_output"
            exit 1
          fi

      - name: Run golint
        run: |
          go install golang.org/x/lint/golint@latest || echo "golint install failed, skipping"
          golint ./... || echo "golint check completed"

      - name: Run go build
        run: |
          if [ -f "go.mod" ]; then
            go build -v ./...
          else
            echo "No go.mod found, skipping build"
          fi
